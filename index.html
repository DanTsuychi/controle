<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto D - Controle de Convidados</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --dark-bg: #050505;
        }
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.3), inset 0 0 15px rgba(255, 0, 60, 0.1);
            padding: 30px;
            margin-top: 20px;
            border-radius: 5px;
            position: relative;
        }
        .logo {
            max-width: 250px;
            display: block;
            margin: 0 auto 30px auto;
            filter: drop-shadow(0 0 10px var(--neon-red));
        }
        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red);
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-red);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: transparent;
            border: 1px solid #333;
            color: var(--neon-red);
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }
        button {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        button:hover {
            background: var(--neon-red);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--neon-red);
        }
        .hidden { display: none !important; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
            font-size: 0.9em;
        }
        th { color: var(--neon-red); }
        .glitch {
            animation: glitch 2s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Projeto D" class="logo glitch">

    <!-- Tela de Login / Cadastro -->
    <div id="loginSection" class="container">
        <h2>Acesso Restrito</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Conectar-se ao Sistema</button>
        <button onclick="cadastrar()" style="border-color:#555; color:#aaa;">Cadastrar Nova Conta</button>
    </div>

    <!-- Painel Principal do Usuário -->
    <div id="mainSection" class="container hidden">
        <button onclick="logout()" style="margin-bottom:20px; border-color:#555; color:#aaa;">Desconectar</button>
        
        <h2>Registro de Entrada</h2>
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="sobrenome" placeholder="Sobrenome">
        <input type="text" id="item" placeholder="Item a levar (ex: Vodka, Gelo)">
        <input type="number" id="qtd" placeholder="Quantidade">
        <input type="text" id="servicos" placeholder="Serviços oferecidos (Opcional)">
        <input type="text" id="valor" placeholder="Valor de ajuda (Opcional - R\$)">
        <button onclick="salvarListagem()">Transmitir Dados</button>

        <div id="minhasListagens" style="margin-top: 15px;"></div>

        <!-- Botão para visualizar a lista geral -->
        <button onclick="toggleListaGeral()" style="margin-top: 25px; border-color: var(--neon-red);">📋 Ver Lista Geral da Festa</button>

        <!-- Seção expansível da Lista Geral -->
        <div id="listaGeralSection" class="hidden" style="margin-top: 20px;">
            <h3>Itens Cadastrados pelos Convidados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Convidado</th>
                        <th>Item</th>
                        <th>Qtd</th>
                        <th>Serviços</th>
                        <th>Ajuda (R\$)</th>
                    </tr>
                </thead>
                <tbody id="tabelaGeral"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pugtfjrukcgytwiitcoh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1Z3RmanJ1a2NneXR3aWl0Y29oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODU5NjIsImV4cCI6MjEwNzU2MTk2Mn0.Vf5gEsaAcMy4N6sB_a0-U6avbm8A53ic5-8xwcd-KvM';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                carregarMinhasListagens();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('mainSection').classList.add('hidden');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("Falha na conexão: " + error.message);
            else checkSession();
        }

        async function cadastrar() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("Erro ao cadastrar: " + error.message);
            else {
                alert("Conta criada com sucesso! Conectando...");
                checkSession();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkSession();
        }

        async function salvarListagem() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const payload = {
                user_id: user.id,
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                item: document.getElementById('item').value,
                quantidade: parseInt(document.getElementById('qtd').value) || 0,
                servicos: document.getElementById('servicos').value,
                valor_ajuda: document.getElementById('valor').value
            };

            const { error } = await supabaseClient.from('listagens').upsert([payload]);
            if (error) alert("Erro ao salvar: " + error.message);
            else {
                alert("Dados transmitidos com sucesso.");
                carregarMinhasListagens();
                carregarListaGeral();
            }
        }

        async function carregarMinhasListagens() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data, error } = await supabaseClient.from('listagens').select('*').eq('user_id', user.id);
            if (!error && data && data.length > 0) {
                const l = data[0]; 
                document.getElementById('nome').value = l.nome || '';
                document.getElementById('sobrenome').value = l.sobrenome || '';
                document.getElementById('item').value = l.item || '';
                document.getElementById('qtd').value = l.quantidade || '';
                document.getElementById('servicos').value = l.servicos || '';
                document.getElementById('valor').value = l.valor_ajuda || '';
                document.getElementById('minhasListagens').innerHTML = `<p style="color:var(--neon-red)">Seus dados atuais estão carregados acima. Edite e clique em "Transmitir Dados" para atualizar.</p>`;
            }
        }

        async function toggleListaGeral() {
            const section = document.getElementById('listaGeralSection');
            if (section.classList.contains('hidden')) {
                await carregarListaGeral();
                section.classList.remove('hidden');
            } else {
                section.classList.add('hidden');
            }
        }

        async function carregarListaGeral() {
            const { data, error } = await supabaseClient.from('listagens').select('*');
            if (!error && data) {
                const tbody = document.getElementById('tabelaGeral');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum item registrado ainda.</td></tr>`;
                    return;
                }
                data.forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.nome} ${row.sobrenome}</td>
                            <td>${row.item || '-'}</td>
                            <td>${row.quantidade || '-'}</td>
                            <td>${row.servicos || '-'}</td>
                            <td>${row.valor_ajuda || '-'}</td>
                        </tr>
                    `;
                });
            }
        }

        checkSession();
    </script>
</body>
</html>
